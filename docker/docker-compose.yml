version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: englishbot_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: englishbot
      POSTGRES_PASSWORD: englishbot_pass
      POSTGRES_DB: englishbot
    volumes:
      - englishbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englishbot -d englishbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  englishbot_pgdata:
